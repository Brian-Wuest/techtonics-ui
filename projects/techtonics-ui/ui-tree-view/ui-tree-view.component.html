<div class="tree-component-wrapper" [class.hidden]="visible() == false">
  @if (showSearch()) {
    <div class="tree-search-box-wrapper">
      <input
        type="text"
        class="tree-search-input"
        [placeholder]="searchPlaceholderText()"
        [value]="internalSearchQuery()"
        (input)="onSearchInput($event)" />
    </div>
  }

  <div
    #viewport
    [id]="id()"
    class="tree-native-viewport"
    [ngClass]="componentClass()"
    [style.height.px]="isFluidLayout() ? null : calculatedViewportHeight()"
    (scroll)="onViewportScroll($event)">
    <!-- Large structural empty track height pushing scrollbars out to accurate metrics -->
    <div class="tree-scroll-runway" [style.height.px]="virtualRenderState().totalHeight">
      <ul [id]="id()" class="tree-root-list" tabindex="0" (keydown)="onKeydown($event)">
        @for (row of virtualRenderState().renderedNodes; track trackById($index, row)) {
          <li
            class="tree-node"
            [style.height.px]="rowHeight()"
            [style.top.px]="row.virtualIndex * rowHeight()">
            <div
              class="node-row"
              [class.selected]="isSelected(row.node.id)"
              [class.focused]="focusedNodeId() === row.node.id"
              [class.invalid-drop]="treeInvalidDropTargetId() === row.node.id"
              [class.drag-over]="dragOverNodeId() === row.node.id"
              [class.drop-above]="
                dragOverNodeId() === row.node.id && dragOverPosition() === 'above'
              "
              [class.drop-inside]="
                dragOverNodeId() === row.node.id && dragOverPosition() === 'inside'
              "
              [class.drop-below]="
                dragOverNodeId() === row.node.id && dragOverPosition() === 'below'
              "
              [attr.draggable]="useDragDrop() ? true : null"
              (dragstart)="onDragStart(row.node, $event)"
              (dragover)="onDragOver(row.node, $event)"
              (dragleave)="onDragLeave()"
              (drop)="onDrop(row.node, $event)"
              (click)="toggleSelect(row.node.originalNode)">
              <span class="indent-spacer" [style.width.rem]="row.node.level * 1.25"></span>

              @if (row.node.expandable) {
                <button
                  class="expander"
                  (click)="toggleExpand(row.node.id); $event.stopPropagation()">
                  {{ isExpanded(row.node) ? '▾' : '▸' }}
                </button>
              } @else {
                <span class="spacer"></span>
              }

              @if (templateToRender()) {
                <ng-container
                  [ngTemplateOutlet]="templateToRender()"
                  [ngTemplateOutletContext]="{ $implicit: row.node.originalNode }">
                </ng-container>
              } @else {
                <!-- Render text via fuzzy match highlight tags -->
                <span class="label">
                  @for (part of getHighlightedParts(row.node.label); track $index) {
                    <span [class.search-highlight]="part.isMatch">{{ part.text }}</span>
                  }
                </span>
              }
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
