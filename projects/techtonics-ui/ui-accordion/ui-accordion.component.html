@if (showActionButtons()) {
  <div class="accordion-actions">
    <button (click)="expandAll()">{{ exclusive() ? 'Expand First' : 'Expand All' }}</button>
    <button (click)="collapseAll()">Collapse All</button>
  </div>
}

<div class="accordion-container">
  @for (item of items(); track item.key; let idx = $index) {
    <div class="accordion-item" [class.disabled]="item.disabled" [class.expanded]="item.expanded">
      <!-- Clickable Header Header -->
      <div class="accordion-header" (click)="toggleItem(idx, $event)">
        @if (headerTemplate()) {
          <ng-container
            *ngTemplateOutlet="headerTemplate()!; context: { $implicit: item }"></ng-container>
        } @else {
          <span class="default-header">{{ item.header || 'Item ' + (idx + 1) }}</span>
        }
        <span class="accordion-icon"></span>
      </div>

      <!-- Animation Content Wrapper Box -->
      <div class="accordion-body-wrapper">
        <div class="accordion-body">
          @if (bodyTemplate()) {
            <ng-container
              *ngTemplateOutlet="bodyTemplate()!; context: { $implicit: item }"></ng-container>
          } @else {
            <p class="default-body">{{ item.body }}</p>
          }
        </div>
      </div>
    </div>
  }
</div>
