<div class="toast-container" #container [ngClass]="componentClass()">
  @for (toast of localToasts(); track toast.id) {
    <div
      class="toast"
      [ngClass]="[toast.type, toast.isLeaving ? 'slide-out' : '']"
      (mouseenter)="pauseToast(toast.id)"
      (mouseleave)="resumeToast(toast)">
      <!-- Dynamic Visual Icons -->
      <span class="toast-icon">
        @if (toast.type === 'success') {
          <!-- Checkmark SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M20 6L9 17l-5-5" />
          </svg>
        } @else if (toast.type === 'error') {
          <!-- X Mark / Error Shield SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" />
            <path d="m15 9-6 6M9 9l6 6" />
          </svg>
        } @else if (toast.type === 'warning') {
          <!-- Warning Triangle SVG -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        } @else {
          <!-- Info Circle SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4M12 8h.01" />
          </svg>
        }
      </span>

      <span class="toast-message">{{ toast.message }}</span>

      <button class="close-btn" (click)="animateOutAndRemove(toast.id)">&times;</button>
    </div>
  }
</div>
