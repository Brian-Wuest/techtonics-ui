<div class="pagination" [ngClass]="componentClass()" [class.hidden]="visible() == false">
  <button class="btn btn-ghost color-secondary" (click)="go(page() - 1)" [disabled]="page() === 1">
    {{ previousButtonText() }}
  </button>

  @for (p of visiblePages(); track p) {
    <button class="btn btn-ghost color-primary" [class.active]="p === page()" (click)="go(p)">
      {{ p }}
    </button>
  }

  <button
    class="btn btn-ghost color-secondary"
    (click)="go(page() + 1)"
    [disabled]="page() === totalPages()">
    {{ nextButtonText() }}
  </button>

  <ui-dropdown
    [items]="rowsPerPageItems()"
    [showClear]="false"
    [value]="selectedRowsPerPage()"
    (valueChange)="onRowsPerPageChanged($event)"></ui-dropdown>
</div>
