@let currentLabel = label();

<div class="field-container" [hidden]="hidden()" [ngClass]="componentClass()">
  <input
    #inputEl
    [attr.id]="name()"
    [attr.name]="actualName()"
    type="checkbox"
    [disabled]="disabled()"
    class="accessible-checkbox"
    [checked]="checked()"
    [required]="required()"
    (change)="changeHandler($event)"
    [class.checked]="checked()"
    [class.is-dirty]="dirty()"
    [class.is-touched]="touched()"
    [class.is-invalid]="invalid()"
    [class.is-pending]="pending()"
    [attr.aria-label]="ariaLabel()" />

  @if (currentLabel && currentLabel.trim() != '') {
    <label class="checkbox-label ml-3" [class.checked]="checked()" (click)="changeHandler($event)">{{
      currentLabel
    }}</label>
  }
  <ui-form-error [errors]="normalizedErrors()" [visible]="shouldShowErrors()"></ui-form-error>

  @if (disabled() && disabledReasons().length) {
    <div class="disabled-reasons">
      @for (reason of disabledReasons(); track reason) {
        <small>{{ reason.message }}</small>
      }
    </div>
  }
</div>
